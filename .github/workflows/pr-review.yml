# Repo-aware, advisory PR review (pr-review-kit). Comments only: never approves,
# never blocks, never a required check. The kit is pinned to one full commit
# SHA in every `uses:` below; a tag or branch would let the engine change under
# the pin. Design: docs/superpowers/specs/2026-10-26-pr-review-agent-design.md.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks (their runs get no secrets) and Dependabot (likewise).
    if: >-
      ${{ !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # The whole repo fits in one read; a longer run is a loop, not size.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # External counterparts: rag-system's default branch, read-only, as data
      # for the model (contract-map.md, "rag-system:" paths). The PR head could
      # ship its own .review-external/; never reuse it. A failed checkout leaves
      # no SHA file, and the external-counterpart fact then says "unavailable".
      - name: Clear external counterpart path
        run: rm -rf .review-external

      - name: Checkout rag-system (external counterparts)
        id: external
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: marcusk639/rag-system
          path: .review-external/rag-system
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            apps/api/src/routes/search.ts
            packages/core/src/types.ts
            packages/core/src/metadata-policy.ts
            docs/archive/specs/

      - name: Record external counterpart SHA
        if: steps.external.outcome == 'success'
        run: |
          git -C .review-external/rag-system rev-parse HEAD > .review-external/rag-system.sha
          rm -rf .review-external/rag-system/.git

      # Facts, then the sandboxed model. Gets the Claude token and nothing else.
      - name: Review
        id: review
        uses: marcusk639/pr-review-kit/actions/review@90809dac179f3b3192ba7ec999d167f7860450cf
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Model-free; the only step with the id key and the advisory token.
      - name: Publish
        if: always()
        uses: marcusk639/pr-review-kit/actions/publish@90809dac179f3b3192ba7ec999d167f7860450cf
        with:
          action_outcome: ${{ steps.review.outputs.outcome }}
          execution_file: ${{ steps.review.outputs.execution_file }}
          id_key: ${{ secrets.PR_REVIEW_ID_KEY }}
          advisory_token: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
