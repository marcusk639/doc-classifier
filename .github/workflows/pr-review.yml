# Repo-aware, advisory PR review (pr-review-kit). Comments only: never approves,
# never blocks, never a required check. The kit is pinned to one full commit
# SHA in every `uses:` below; a tag or branch would let the engine change under
# the pin. rag-system is read through .pr-review/config.json externalCheckouts.
# Optional secret PR_REVIEW_REDACT_TERMS (newline-separated) strips consuming
# products' names from everything posted (the repo names no consumer).
# Design: docs/superpowers/specs/2026-10-26-pr-review-agent-design.md.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks (their runs get no secrets) and Dependabot (likewise).
    if: >-
      ${{ !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # The whole repo fits in one read; a longer run is a loop, not size.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Facts, then the sandboxed model. Gets the Claude token and nothing else.
      - name: Review
        id: review
        uses: marcusk639/pr-review-kit/actions/review@0d2693d351bb87fe576944f4aad1a7699c3d3964
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          redact_terms: ${{ secrets.PR_REVIEW_REDACT_TERMS }}

      # Model-free; the only step with the id key and the advisory token.
      - name: Publish
        if: always()
        uses: marcusk639/pr-review-kit/actions/publish@0d2693d351bb87fe576944f4aad1a7699c3d3964
        with:
          trust_sha: ${{ steps.review.outputs.trust_sha }}
          action_outcome: ${{ steps.review.outputs.outcome }}
          execution_file: ${{ steps.review.outputs.execution_file }}
          id_key: ${{ secrets.PR_REVIEW_ID_KEY }}
          advisory_token: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
          redact_terms: ${{ secrets.PR_REVIEW_REDACT_TERMS }}
